title: paul-ej.dev
tagline: Apple · Device Management · Cloud Security
author: Paul E-J
url: "https://paul-ej.dev"
baseurl: ""

theme: minima

# Build settings
markdown: kramdown
permalink: /:year/:month/:day/:title/

# Show post excerpts on the home page
show_excerpts: true

# Only show About in the nav
header_pages:
  - about.md

# Minima theme settings
minima:
  skin: dark
  social_links:
    - { platform: github, user_url: "https://github.com/paul-ej" }

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
