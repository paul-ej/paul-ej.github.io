title: Paul E-J's Ramblings
description: All things MDM, Apple, security and a bunch inbetween
url: "https://paul-ej.dev"
baseurl: ""

theme: minima

# Build settings
markdown: kramdown
permalink: /:year/:month/:day/:title/

# Minima theme settings
minima:
  skin: classic
  social_links:
    - { platform: github, user_url: "https://github.com/paul-ej" }

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
